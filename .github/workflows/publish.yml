name: publish packages

# Публикация NuGet-пакетов rshared в GitHub Packages.
# Триггер: пуш в main (каждый мердж = патч-релиз) или ручной запуск.
# Версия: major.minor из version.json (правится в МР), патч = последняя
# опубликованная в фиде версия серии + 1.
# После успешной публикации — тег v{версия} на мердж-коммит.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # тег релиза
  packages: write

env:
  FEED_OWNER: revealyan
  FEED_USER: ${{ github.actor }}
  FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        run: |
          base=$(jq -r '.version' version.json)
          max=-1
          # версия общая на все пакеты — берём максимум патча по всем пяти в фиде
          for pkg in rshared.authkit rshared.mediator rshared.orm rshared.orm.entityframeworkcore rshared.rabbitmq; do
            resp=$(curl -sf -u "$FEED_USER:$FEED_TOKEN" \
              "https://nuget.pkg.github.com/$FEED_OWNER/flatcontainer/$pkg/index.json" \
              || echo '{"versions":[]}')
            p=$(echo "$resp" | jq -r --arg base "$base" \
              '[.versions[] | select(startswith($base + ".")) | split(".") | select(length == 3) | .[2] | select(test("^[0-9]+$")) | tonumber] | max // -1')
            if [ "$p" -gt "$max" ]; then max=$p; fi
          done
          version="$base.$((max + 1))"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Publishing $version"

      - name: Pack
        run: dotnet pack RShared.slnx -c Release -o dist -p:Version="$VERSION"

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "dist/*.nupkg"
          --source https://nuget.pkg.github.com/revealyan/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Tag release
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
