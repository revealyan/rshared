name: ci

# Проверка PR и main: сборка решения.
# Тестов пока нет — шаг dotnet test появится вместе с первым тестовым проектом.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build RShared.slnx -c Release
